name: download-photos
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vendor photos
        run: bash download_photos.sh
      - name: Commit photos to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos
          git commit -m "photos: фото вендоров, скачаны раннером GitHub Actions" || echo "nothing to commit"
          git push
