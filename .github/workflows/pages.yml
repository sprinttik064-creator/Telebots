name: pages
# Запуск вручную: Actions → pages → Run workflow.
# Перед первым запуском включить Pages: Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать статику для Pages
        run: |
          # корневой index.html = платформа; выкидываем тяжёлые папки-кандидаты
          cp avtodom-platforma-local.html index.html
          rm -rf photos/src-ct photos/src-rct photos/src-crt photos/src-kk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
